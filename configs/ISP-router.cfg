! Device : ISP-router
! Source : Cisco Packet Tracer 1941 (IOS 15.1) running-config, copied from the lab notes PDF;
!          blank/duplicate '!' lines and the license line removed
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname ISP-router
!
no ip cef
no ipv6 cef
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
no ip address
duplex auto
speed auto
shutdown
!
interface GigabitEthernet0/1
no ip address
duplex auto
speed auto
shutdown
!
interface Serial0/0/0
ip address 100.10.10.2 255.255.255.0
clock rate 2000000
!
interface Serial0/0/1
ip address 192.168.12.2 255.255.255.0
!
interface Serial0/1/0
ip address 192.168.22.2 255.255.255.0
!
interface Serial0/1/1
ip address 192.168.32.2 255.255.255.0
!
interface Vlan1
no ip address
shutdown
!
router eigrp 100
redistribute rip metric 1544 200 250 10 1500
redistribute ospf 1 metric 1544 2000 250 10 1500
redistribute static
network 192.168.22.0
!
router ospf 1
log-adjacency-changes
redistribute rip subnets
redistribute eigrp 100 subnets
network 192.168.32.0 0.0.0.255 area 0
default-information originate
!
router rip
redistribute eigrp 100 metric 6
redistribute ospf 1 metric 5
network 192.168.12.0
default-information originate
!
ip classless
ip route 0.0.0.0 0.0.0.0 100.10.10.1
!
ip flow-export version 9
!
line con 0
!
line aux 0
!
line vty 0 4
login
!
end
